name: Build and deploy

# Required repo secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST     - server's public IP or hostname
#   EC2_USER     - ssh user (e.g. ubuntu)
#   EC2_SSH_KEY  - private key matching a public key in the server's ~/.ssh/authorized_keys
#
# Repo is public, so the ghcr.io image is public too (same visibility as the
# repo on first push) - no registry login needed on the server to pull it.
# If the repo/package visibility ever changes to private, add a GHCR_TOKEN
# secret (PAT, read:packages scope) and `docker login ghcr.io` before pulling.
#
# One-time server setup (run once, by hand, before the first deploy):
#   mkdir -p ~/learning-node
#   put a .env file in ~/learning-node with POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/learning-node"

      - name: Pull new image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # .env on the server holds POSTGRES_*; IMAGE is set inline per
          # deploy instead of being written into .env, so it never leaks
          # into local `docker compose up --build` runs.
          envs: IMAGE
          script: |
            cd ~/learning-node
            export IMAGE="${IMAGE}:${{ github.sha }}"
            docker compose pull app
            docker compose up -d
            docker image prune -f
